        // Función para crear el header
        function crearHeader() {
            const header = document.createElement("div");
            header.className = "bg-white rounded-lg shadow-xl p-8 mb-8";
            header.innerHTML = `
                <div class="text-center">
                    <h1 class="text-4xl font-bold text-gray-800 mb-2">${miCV.datosPersonales.nombre}</h1>
                    <p class="text-lg text-gray-600 mb-4">${miCV.datosPersonales.descripcion}</p>
                    <div class="flex flex-wrap justify-center gap-4 text-sm text-gray-700">
                        <span class="flex items-center gap-1">📧 ${miCV.datosPersonales.email}</span>
                        <span class="flex items-center gap-1">📱 ${miCV.datosPersonales.telefono}</span>
                        <span class="flex items-center gap-1">📍 ${miCV.datosPersonales.direccion}</span>
                    </div>
                    <div class="mt-4">
                        <a href="${miCV.datosPersonales.github}" target="_blank" class="text-blue-600 hover:text-blue-800 underline">
                            GitHub Profile
                        </a>
                    </div>
                </div>
            `;
            return header;
        }

        // Función para crear sección de experiencia
        function crearSeccionExperiencia() {
            const seccion = document.createElement("div");
            seccion.className = "bg-white rounded-lg shadow-xl p-8 mb-8";
            seccion.innerHTML = `<h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-blue-500 pb-2">💼 Experiencia Laboral</h2>`;

            const tarjetasContainer = document.createElement("div");
            tarjetasContainer.className = "flex flex-wrap gap-6 justify-center max-w-7xl mx-auto";

            miCV.experiencia.forEach(exp => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "bg-gradient-to-br from-blue-50 to-white border border-blue-200 rounded-lg p-6 shadow-md hover:shadow-xl transition-shadow w-full md:w-[calc(50%-12px)]";
                tarjeta.innerHTML = `
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">${exp.puesto}</h3>
                    <p class="text-blue-600 font-medium mb-1">${exp.empresa}</p>
                    <p class="text-sm text-gray-600 mb-2">${exp.ubicacion} • ${exp.periodo}</p>
                    <p class="text-gray-700 text-sm">${exp.descripcion}</p>
                `;
                tarjetasContainer.appendChild(tarjeta);
            });

            seccion.appendChild(tarjetasContainer);
            return seccion;
        }

        // Función para crear sección de formación
        function crearSeccionFormacion() {
            const seccion = document.createElement("div");
            seccion.className = "bg-white rounded-lg shadow-xl p-8 mb-8";
            seccion.innerHTML = `<h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-green-500 pb-2">🎓 Formación Académica</h2>`;

            const tarjetasContainer = document.createElement("div");
            tarjetasContainer.className = "flex flex-wrap gap-6 justify-center max-w-7xl mx-auto";

            miCV.formacion.forEach(form => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "bg-gradient-to-br from-green-50 to-white border border-green-200 rounded-lg p-6 shadow-md hover:shadow-xl transition-shadow w-full md:w-[calc(50%-12px)]";
                tarjeta.innerHTML = `
                    <span class="inline-block bg-green-100 text-green-800 text-xs px-3 py-1 rounded-full mb-3">${form.tipo}</span>
                    <h3 class="text-xl font-semibold text-gray-800 mb-2">${form.titulo}</h3>
                    <p class="text-green-600 font-medium mb-1">${form.institucion}</p>
                    <p class="text-sm text-gray-600">${form.ubicacion} • ${form.periodo}</p>
                `;
                tarjetasContainer.appendChild(tarjeta);
            });

            seccion.appendChild(tarjetasContainer);
            return seccion;
        }

        // Función para crear sección de conocimientos
        function crearSeccionConocimientos() {
            const seccion = document.createElement("div");
            seccion.className = "bg-white rounded-lg shadow-xl p-8 mb-8";
            seccion.innerHTML = `<h2 class="text-3xl font-bold text-gray-800 mb-6 border-b-2 border-purple-500 pb-2">🛠️ Conocimientos Técnicos</h2>`;

            const tarjetasContainer = document.createElement("div");
            tarjetasContainer.className = "flex flex-wrap gap-4 justify-center max-w-7xl mx-auto";

            miCV.conocimientos.forEach(conocimiento => {
                const tarjeta = document.createElement("div");
                tarjeta.className = "bg-gradient-to-br from-purple-50 to-white border border-purple-200 rounded-lg px-4 py-3 shadow-md hover:shadow-lg transition-shadow";
                tarjeta.innerHTML = `
                    <p class="text-gray-800 font-medium">${conocimiento.nombre}</p>
                    <p class="text-xs text-purple-600">${conocimiento.nivel}</p>
                `;
                tarjetasContainer.appendChild(tarjeta);
            });

            seccion.appendChild(tarjetasContainer);
            return seccion;
        }

        // Función para crear sección de aptitudes e idiomas
        function crearSeccionAptitudesIdiomas() {
            const seccion = document.createElement("div");
            seccion.className = "bg-white rounded-lg shadow-xl p-8 mb-8";

            const contenedor = document.createElement("div");
            contenedor.className = "grid md:grid-cols-2 gap-8";

            // Aptitudes
            const aptitudes = document.createElement("div");
            aptitudes.innerHTML = `
                <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-orange-500 pb-2">⭐ Aptitudes</h2>
                <ul class="space-y-2">
                    ${miCV.aptitudes.map(apt => `<li class="flex items-start gap-2 text-gray-700"><span class="text-orange-500 mt-1">•</span><span>${apt}</span></li>`).join('')}
                </ul>
            `;

            // Idiomas y Datos Extra
            const extra = document.createElement("div");
            extra.innerHTML = `
                <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-orange-500 pb-2">🌍 Idiomas</h2>
                <ul class="space-y-2 mb-6">
                    ${miCV.idiomas.map(idioma => `<li class="flex items-start gap-2 text-gray-700"><span class="text-orange-500 mt-1">•</span><span>${idioma.idioma}: ${idioma.nivel}</span></li>`).join('')}
                </ul>
                <h2 class="text-2xl font-bold text-gray-800 mb-4 border-b-2 border-orange-500 pb-2">📋 Datos Adicionales</h2>
                <ul class="space-y-2">
                    ${miCV.datosExtra.map(dato => `<li class="flex items-start gap-2 text-gray-700"><span class="text-orange-500 mt-1">•</span><span>${dato}</span></li>`).join('')}
                </ul>
            `;

            contenedor.appendChild(aptitudes);
            contenedor.appendChild(extra);
            seccion.appendChild(contenedor);
            return seccion;
        }

        // Renderizar el CV
        function renderizarCV() {
            const container = document.getElementById('cv-container');
            container.appendChild(crearHeader());
            container.appendChild(crearSeccionExperiencia());
            container.appendChild(crearSeccionFormacion());
            container.appendChild(crearSeccionConocimientos());
            container.appendChild(crearSeccionAptitudesIdiomas());
        }

        // Inicializar
        renderizarCV();
